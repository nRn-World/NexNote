<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexNote</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0D0F16" />
    <meta name="description" content="A modern platform for developers and creatives to store and share code snippets and notes." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      if ('serviceWorker' in navigator) {
        // Register once; sw.js already versions its cache and clears old ones on activate.
        // Unregistering on every load would tear the worker down before it can serve offline.
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {
            /* Offline support is optional — never block the app on it. */
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
